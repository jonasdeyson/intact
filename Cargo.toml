[package]
name = "intact"
version = "0.2.1-dev"
edition = "2024"
rust-version = "1.85"
description = "An encoding-preserving command-line text editor."
license = "MIT"
readme = "README.md"
repository = "https://github.com/jonasdeyson/intact"
keywords = ["encoding", "charset", "editor", "cli", "text"]
categories = ["command-line-utilities", "text-processing", "encoding"]

[[bin]]
name = "intact"
path = "src/main.rs"

[dependencies]
chardetng = "1.0"
clap = { version = "4", features = ["derive", "wrap_help"] }
encoding_rs = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
