name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target ${{ matrix.target }}
          rustup default stable
          rustc --version

      - name: Install cross-compilation tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure linker
        if: matrix.linker != ''
        run: |
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify packaging
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo publish --dry-run --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar czf intact-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release intact

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/intact.exe -DestinationPath intact-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intact-${{ matrix.target }}
          path: intact-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    # Only tag pushes cut a release; branch dispatches just leave the
    # build artifacts on the run for manual download.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml"
            exit 1
          fi

      # The notes are this version's CHANGELOG section, with hard-wrapped lines
      # joined back up: a release body shows every line break. The release is
      # a draft, so they can still be edited before publishing.
      - name: Extract release notes
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            /^## \[/ { if (on) exit; on = (index($0, heading) == 1); next }
            /^\[[^]]*\]: / { exit }
            !on { next }
            /^[[:space:]]*$/ || /^#/ { if (buf != "") print buf; buf = ""; print; next }
            /^- / { if (buf != "") print buf; buf = $0; next }
            { sub(/^[[:space:]]+/, ""); buf = (buf == "" ? $0 : buf " " $0) }
            END { if (buf != "") print buf }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || {
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body_path: notes.md
